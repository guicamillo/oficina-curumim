name: Deploy to GitHub Pages

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  build:
    # Only the owner can deploy or rerun a deployment from a merged pull request.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.merged_by.id == 5016970 &&
      github.actor_id == '5016970' &&
      github.triggering_actor == 'guicamillo'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit merged into main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Install, build, and upload the site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          package-manager: bun@latest
          cache: false

  deploy:
    needs: build
    if: github.triggering_actor == 'guicamillo'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
